<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request a Quote - HEPTRA Services LLC</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header>
    <img src="../logo.png" alt="HEPTRA Logo" class="logo" />
    <nav>
      <a href="../index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
      <a href="quote.html" style="text-decoration: underline; font-weight: bold;">Request a Quote</a>
    </nav>
  </header>
  <main>
    <h1>Request a Quote</h1>
    <form class="contact-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" />

      <label for="service">Service Interested In</label>
      <select id="service" name="service" required>
        <option value="" disabled selected>Select a service</option>
        <option value="residential">Residential Cleaning</option>
        <option value="commercial">Commercial Janitorial Services</option>
        <option value="floor-care">Floor Care and Maintenance</option>
        <option value="window-washing">Window Washing</option>
        <option value="post-construction">Post-Construction Cleaning</option>
        <option value="disinfection">Disinfection & Sanitization</option>
      </select>

      <label for="details">Additional Details / Questions</label>
      <textarea id="details" name="details" rows="5" placeholder="Please provide any additional information here..."></textarea>

      <button type="submit">Submit Quote Request</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2025 HEPTRA Services LLC</p>
  </footer>
</body>
</html>
